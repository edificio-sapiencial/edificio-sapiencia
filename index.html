<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edificio Sapiencia 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- BARRA SUPERIOR -->
    <!-- ============================= -->

    <header class="barra-superior">

        <div class="logo">

            <span class="logo-principal">
                Sapiencia
            </span>

            <span class="logo-subtitulo">
                Agencia de Educación Postsecundaria de Medellín
            </span>

        </div>

        <div class="botones">

            <button
                class="boton"
                title="Calendario">
                📅
            </button>

            <button
                class="boton"
                title="Usuarios">
                👥
            </button>

            <button
                class="boton"
                title="Mensajes">
                💬
            </button>

            <button
                class="boton boton-mapa"
                id="boton-mapa"
                title="Ubicación">
                📍
            </button>

            <button
                class="menu"
                title="Menú">
                ☰
            </button>

        </div>

    </header>


    <!-- ============================= -->
    <!-- VENTANA DE UBICACIÓN -->
    <!-- ============================= -->

    <div
        class="ventana-ubicacion"
        id="ventana-ubicacion">

        <button
            class="cerrar-ubicacion"
            id="cerrar-ubicacion"
            title="Cerrar">
            ×
        </button>

        <div class="ubicacion-titulo">

            <span>📍</span>

            <strong>
                Ubicación del edificio
            </strong>

        </div>

        <div class="ubicacion-contenido">

            <p>
                <strong>Dirección:</strong>
            </p>

            <p>
                Cra. 73 # 65 - 296
            </p>

            <p>
                El Progreso, Medellín,
                Castilla, Medellín, Antioquia
            </p>

            <p class="telefono">

                <strong>
                    Teléfono:
                </strong>

                <a href="tel:+576044447947">
                    (604) 4447947
                </a>

            </p>

            <a
                class="boton-google-maps"
                href="https://www.google.com/maps/search/?api=1&query=Cra%2073%20%2365-296%20El%20Progreso%20Medell%C3%ADn%20Antioquia"
                target="_blank"
                rel="noopener noreferrer">

                📍 Ver ubicación en Google Maps

            </a>

        </div>

    </div>


    <!-- ============================= -->
    <!-- VISOR 3D -->
    <!-- ============================= -->

    <main id="visor-3d">

        <!-- MODELO 3D -->

        <div id="modelo-3d"></div>


        <!-- PANTALLA COMPLETA -->

        <button
            class="pantalla-completa"
            id="boton-pantalla-completa"
            title="Pantalla completa">

            ⛶

        </button>

    </main>


    <!-- ============================= -->
    <!-- THREE.JS -->
    <!-- ============================= -->

    <script type="importmap">

    {
        "imports": {

            "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

        }
    }

    </script>


    <!-- ============================= -->
    <!-- SCRIPT PRINCIPAL -->
    <!-- ============================= -->

    <script
        type="module"
        src="script.js">
    </script>

</body>

</html>
